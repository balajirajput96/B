name: Automation package check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate static site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          grep -q '<html lang="en">' index.html
          grep -q 'href="styles.css"' index.html
          grep -q 'id="services"' index.html
          grep -q 'id="about"' index.html
          grep -q 'id="contact"' index.html
          grep -q '.container' styles.css
          grep -q '@media' styles.css

      - name: Validate n8n workflow exports
        run: python3 automation/n8n-package/scripts/validate_workflows.py

      - name: Reject obvious secret literals
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='completion-assessment.json' --exclude='manifest.json' \
            '(sk-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,}|pplx-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY)' \
            automation/n8n-package; then
            echo 'Potential secret literal detected.' >&2
            exit 1
          fi
